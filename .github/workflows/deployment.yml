name: Verify live deployment
on:
  push:
    branches: [main]
    paths: [".github/workflows/deployment.yml", "scripts/check-deployment.py", "web/**", "vercel.json"]
  workflow_dispatch:
permissions:
  contents: write
  deployments: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Discover and verify the matching Vercel deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-deployment.py
      - name: Publish deployment verification
        if: always()
        run: |
          test -f results/deployment.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/deployment.json
          git diff --cached --quiet || git commit -m "Record verified live deployment URL"
          git pull --rebase origin main
          git push
