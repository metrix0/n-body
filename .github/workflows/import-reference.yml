name: Import reference
on:
  push:
    paths: [".github/workflows/import-reference.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download and preserve the reference archive
        run: |
          python3 - <<'PY'
          import hashlib, io, json, pathlib, urllib.request, zipfile
          url = "https://raw.githubusercontent.com/hpc-fci-mackenzie/mpp/master/22/nbody.zip"
          data = urllib.request.urlopen(url, timeout=60).read()
          blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          assert blob == "cf853be79ccf99e115595a1086a53cf45ba0942e", blob
          root = pathlib.Path("reference")
          root.mkdir(exist_ok=True)
          archive = zipfile.ZipFile(io.BytesIO(data))
          for entry in archive.infolist():
              p = pathlib.PurePosixPath(entry.filename)
              if p.is_absolute() or ".." in p.parts:
                  raise ValueError("Unsafe archive member")
              if entry.is_dir():
                  continue
              target = root.joinpath(*p.parts)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(archive.read(entry))
          (root / "provenance.json").write_text(json.dumps({"url": url, "git_blob": blob, "sha256": hashlib.sha256(data).hexdigest(), "files": archive.namelist()}, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference
          git diff --cached --quiet || git commit -m "Preserve original 2022 N-body reference and provenance"
          git push
