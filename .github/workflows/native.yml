name: Native correctness and benchmarks
on:
  push:
    branches: [main]
    paths: ["src/**", "reference/**", "scripts/test.py", "scripts/benchmark.py", "Makefile", ".github/workflows/native.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compile, verify against reference, and measure
        id: measure
        run: |
          make test
          make benchmark
      - name: Publish measured data
        if: always()
        env:
          OUTCOME: ${{ steps.measure.outcome }}
        run: |
          mkdir -p results
          python3 - <<'PY'
          import json, os, pathlib
          pathlib.Path("results/native-status.json").write_text(json.dumps({"outcome": os.environ["OUTCOME"], "commit": os.environ["GITHUB_SHA"], "run": os.environ["GITHUB_RUN_ID"]}, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "Record native validation and reproducible benchmark measurements"
          git pull --rebase origin main
          git push
