name: Inspect public Vercel deployment
on:
  push:
    paths: [".github/workflows/live-probe.yml"]
permissions:
  contents: write
  deployments: read
  statuses: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify public application endpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, os, pathlib, re, urllib.request, urllib.parse
          repo=os.environ["GITHUB_REPOSITORY"]
          def gh(path):
              req=urllib.request.Request("https://api.github.com/repos/"+repo+path,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
              return json.load(urllib.request.urlopen(req,timeout=8))
          def public(url):
              return urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"nbody-check"}),timeout=8).read()
          combined=gh("/commits/e40aeb09112006f658801d85c329686b8596cf0e/status")
          candidates=set()
          inspect={}
          for status in combined.get("statuses",[]):
              target=status.get("target_url","")
              parsed=urllib.parse.urlsplit(target)
              parts=parsed.path.strip("/").split("/")
              if parsed.hostname=="vercel.com" and len(parts)>=3:
                  team,project=parts[:2]
                  candidates.update([f"https://{project}-{team}.vercel.app",f"https://{project}-git-main-{team}.vercel.app"])
                  try:
                      page=public(target).decode("utf-8",errors="replace")
                      found=set(re.findall(r"[a-z0-9][a-z0-9.-]*[.]vercel[.]app",page))
                      candidates.update("https://"+v for v in found)
                      inspect[target]={"domains":sorted(found),"size":len(page),"title":re.findall(r"<title>(.*?)</title>",page)[:1]}
                  except Exception as exc:
                      inspect[target]={"error":str(exc)}
          expected=json.loads(pathlib.Path("results/benchmark.json").read_text())["source_commit"]
          def check(url):
              result={"url":url}
              try:
                  response=urllib.request.urlopen(url+"/",timeout=8)
                  html=response.read()
                  result.update(final_url=response.url,title=re.findall(r"<title>(.*?)</title>",html.decode("utf-8",errors="replace"))[:1])
                  data=json.loads(public(url+"/data/benchmark.json"))
                  result["verified"]=b"canvas-seq" in html and data.get("source_commit")==expected
              except Exception as exc:
                  result.update(verified=False,error=str(exc))
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              checks=list(pool.map(check,sorted(candidates)))
          report={"commit":os.environ["GITHUB_SHA"],"statuses":combined.get("statuses"),"inspection":inspect,"checks":checks}
          pathlib.Path("results/live-probe.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/live-probe.json
          git commit -m "Record public deployment inspection"
          git pull --rebase origin main
          git push
